name: Super Bot 24/7 Cloud Orchestrator (Expert Level)

on:
  schedule:
    # Se ejecuta 4 veces al día (cada 6 horas) para evitar spam de correos y mantener la racha limpia
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  autonomous-execution:
    name: Execute Autonomous Engine & Keep-Alive
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute Super Bot Engine
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/super_bot_engine.py
