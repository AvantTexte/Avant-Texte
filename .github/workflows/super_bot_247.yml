name: Super Bot 24/7 Cloud Orchestrator (Expert Level)

on:
  schedule:
    # Se ejecuta automáticamente cada 30 minutos en los servidores de GitHub
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  autonomous-execution:
    name: Execute Autonomous Engine & Keep-Alive
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute Super Bot Engine
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/super_bot_engine.py

      - name: Run Quality & Performance Verification
        run: |
          python -m unittest discover -s tests -p "test_*.py" || true
