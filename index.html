<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Liseur - Francés con Pilote de guerre</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-top">
                <div class="logo">
                    <span class="flag">🇫🇷</span>
                    <h1>Proyecto Liseur</h1>
                </div>
                <div class="user-stats">
                    <span class="stat-badge xp-badge">⚡ <span id="user-xp">0</span> XP</span>
                    <span class="stat-badge level-badge">⭐ Nivel <span id="user-level">1</span></span>
                </div>
            </div>

            <!-- Navegación de Modos -->
            <div class="mode-nav">
                <button class="nav-btn active" id="btn-mode-cards" onclick="switchMode('cards')">🎴 Tarjetas</button>
                <button class="nav-btn" id="btn-mode-quiz" onclick="switchMode('quiz')">🎮 Quiz XP</button>
            </div>
            
            <div class="chapter-filter-container">
                <label for="chapter-select">📖 Capítulo:</label>
                <select id="chapter-select" onchange="filterByChapter()">
                    <option value="ALL">Cargando capítulos...</option>
                </select>
            </div>

            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </header>

        <!-- VISTA 1: Flashcards -->
        <main class="flashcard-section" id="section-cards">
            <div class="card-container" id="card-container" onclick="flipCard()">
                <div class="card-inner" id="card-inner">
                    <!-- Frente (Francés) -->
                    <div class="card-front">
                        <div class="card-badges">
                            <span class="chapter-badge" id="card-chapter">Chapitre I</span>
                            <span class="badge" id="card-type">Sustantivo</span>
                        </div>
                        <h2 class="word-fr" id="card-fr">Chargement...</h2>
                        <p class="click-hint">Toca la tarjeta para traducir 🔄</p>
                        <button class="audio-btn" onclick="event.stopPropagation(); speakWord();">
                            🔊 Escuchar Pronunciación
                        </button>
                    </div>

                    <!-- Reverso (Español + Frase) -->
                    <div class="card-back">
                        <span class="back-title">Traducción en Español:</span>
                        <h3 class="word-es" id="card-es">Cargando...</h3>
                        <div class="quote-box">
                            <span class="quote-label">📖 Cita literal de Saint-Exupéry:</span>
                            <p class="quote-fr" id="quote-fr">""</p>
                            <p class="quote-es" id="quote-es">""</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="action-buttons">
                <button class="btn btn-again" onclick="nextCard(false)">❌ Repasar Luego</button>
                <button class="btn btn-know" onclick="nextCard(true)">✅ Aprendida (+5 XP)</button>
            </div>
        </main>

        <!-- VISTA 2: Quiz de Opción Múltiple -->
        <main class="quiz-section hidden" id="section-quiz">
            <div class="quiz-card">
                <div class="quiz-header">
                    <span class="chapter-badge" id="quiz-chapter">Chapitre I</span>
                    <button class="audio-btn-sm" onclick="speakQuizWord()">🔊 Escuchar</button>
                </div>
                <h2 class="quiz-word" id="quiz-fr">Chargement...</h2>
                <p class="quiz-instruction">¿Cuál es la traducción correcta al español?</p>

                <div class="quiz-options" id="quiz-options">
                    <!-- 4 alternativas dinámicas -->
                </div>

                <div class="quiz-feedback hidden" id="quiz-feedback">
                    <p id="feedback-text"></p>
                    <button class="btn btn-next-quiz" onclick="nextQuizQuestion()">Siguiente Pregunta ➔</button>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <p>Ficha <span id="current-index">1</span> de <span id="total-cards">0</span> | <strong>Pilote de guerre</strong></p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
