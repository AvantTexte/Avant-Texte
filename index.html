<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Avant-Texte | Práctica de Vocabulario</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="container">
    <header>
      <h1>Avant-Texte</h1>
      <p>Aprende vocabulario en francés antes de leer el texto original.</p>
    </header>

    <section id="selector-box">
      <label for="chapterSelect"><strong>Seleccionar Lección:</strong></label>
      <select id="chapterSelect">
        <option value="datos/pilote-de-guerre-ch1.json">Pilote de guerre - Capítulo 1</option>
      </select>
    </section>

    <main id="app">
      <!-- Tarjeta de Vocabulario (Flashcard) -->
      <div id="flashcard-box" class="box">
        <span id="progress-info">Cargando...</span>
        <h2 id="fr-word">---</h2>
        <p id="word-type"><em>(-)</em></p>
        
        <button id="audio-btn" type="button">🔊 Pronunciar (FR)</button>

        <div class="input-group">
          <input type="text" id="user-answer" placeholder="Escribe la traducción en español..." autocomplete="off">
          <button id="check-btn" type="button">Comprobar</button>
        </div>

        <p id="feedback"></p>
      </div>

      <!-- Sección de Lectura (Premios al completar la lección) -->
      <div id="reading-box" class="box" style="display: none;">
        <h3>¡Felicidades! Lección completada 🎉</h3>
        <p>Has repasado todo el vocabulario clave. Ahora puedes proceder a leer el texto original en francés.</p>
      </div>
    </main>

    <footer>
      <small>Avant-Texte — Proyecto Abierto | Julianidiego</small>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
